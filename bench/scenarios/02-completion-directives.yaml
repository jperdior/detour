name: completion-directives
repo: https://github.com/spf13/cobra
ref: v1.10.2
notes: Answer lives in completions.go (1020 lines). Delegation should help.
prompt: |
  List every ShellCompDirective value defined in this repository, and give the
  names of the two hidden commands cobra uses to request shell completions
  (with and without descriptions). Answer in a short list.
expect:
  - 'ShellCompDirectiveError'
  - 'ShellCompDirectiveNoSpace'
  - 'ShellCompDirectiveNoFileComp'
  - 'ShellCompDirectiveFilterFileExt'
  - 'ShellCompDirectiveFilterDirs'
  - 'ShellCompDirectiveKeepOrder'
  - 'ShellCompDirectiveDefault'
  - '__complete\b'
  - '__completeNoDesc'
